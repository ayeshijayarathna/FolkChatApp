pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://artifactory.agoralab.co/artifactory/maven-public/' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://www.jitpack.io' }
        maven { url(new File(rootDir, "../node_modules/react-native/android")) }
        maven { url(new File(rootDir, "../node_modules/jsc-android/dist")) }
    }
}

rootProject.name = 'FolkChatApp'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')